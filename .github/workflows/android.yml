name: Android package candidate
on:
  push:
    paths: ["android/**", ".github/workflows/android.yml", "scripts/verify_android_release.py", "tests/python/test_android_release_manifest.py"]
  pull_request:
    paths: ["android/**", ".github/workflows/android.yml", "scripts/verify_android_release.py", "tests/python/test_android_release_manifest.py"]
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: android-${{ github.ref }}
  cancel-in-progress: true
jobs:
  compile:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    env:
      TRUCKCONTROL_BUNDLETOOL_JAR: ${{ runner.temp }}/truckcontrol-bundletool-1.18.3.jar
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
      - name: Verify existing SDK and Java
        shell: bash
        run: |
          set -euo pipefail
          test -f "$ANDROID_HOME/platforms/android-36/android.jar"
          test -x "$ANDROID_HOME/build-tools/36.0.0/apksigner"
          test -x "$JAVA_HOME_21_X64/bin/javac"
      - name: Verify pinned Gradle already installed in the official runner image
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import os, re, shutil, subprocess
          binary = shutil.which("gradle")
          if not binary:
              raise SystemExit("Pinned Gradle 9.8.2 is missing from the official runner")
          env = os.environ.copy()
          env["JAVA_HOME"] = env["JAVA_HOME_21_X64"]
          version = subprocess.run([binary, "--version", "--console=plain"], check=True, capture_output=True, text=True, env=env).stdout
          if not re.search(r"^Gradle 9\.8\.2\s*$", version, re.MULTILINE):
              raise SystemExit("Installed Gradle differs from the approved 9.8.2 toolchain")
          print("Verified official runner toolchain: Gradle 9.8.2 and Java 21")
          PY
      - name: Test release manifest policy against source contracts and rejected fixtures
        run: python3 -m unittest discover -s tests/python -p 'test_android_release_manifest.py'
      - name: Verify pinned official Google bundletool checksum and version
        shell: bash
        run: |
          set -euo pipefail
          export PATH="$JAVA_HOME_21_X64/bin:$PATH"
          curl --fail --location --silent --show-error --proto '=https' --tlsv1.2 --max-time 60 \
            https://github.com/google/bundletool/releases/download/1.18.3/bundletool-all-1.18.3.jar \
            --output "$TRUCKCONTROL_BUNDLETOOL_JAR"
          python3 scripts/verify_android_release.py --tool "$TRUCKCONTROL_BUNDLETOOL_JAR" --verify-tool-only
      - name: Compile, test, lint and prepare unsigned release
        shell: bash
        working-directory: android
        run: |
          set -euo pipefail
          export JAVA_HOME="$JAVA_HOME_21_X64"
          gradle --no-daemon --console=plain :app:testDebugUnitTest :app:lintRelease :app:assembleDebug :app:bundleRelease
          "$ANDROID_HOME/build-tools/36.0.0/apksigner" verify --verbose --print-certs app/build/outputs/apk/debug/app-debug.apk
          python3 - <<'PY'
          import hashlib, json, os, pathlib, subprocess, xml.etree.ElementTree as ET, zipfile
          apk = pathlib.Path("app/build/outputs/apk/debug/app-debug.apk")
          aab = pathlib.Path("app/build/outputs/bundle/release/app-release.aab")
          with zipfile.ZipFile(aab) as archive:
              if any(name.upper().startswith("META-INF/") and name.upper().endswith((".RSA", ".DSA", ".EC")) for name in archive.namelist()):
                  raise SystemExit("Unexpected release signing material")
          reports = list(pathlib.Path("app/build/test-results/testDebugUnitTest").glob("TEST-*.xml"))
          suites = [ET.parse(p).getroot() for p in reports]
          tests = sum(int(s.get("tests", 0)) for s in suites)
          failures = sum(int(s.get("failures", 0)) + int(s.get("errors", 0)) for s in suites)
          skipped = sum(int(s.get("skipped", 0)) for s in suites)
          if tests < 5 or failures or skipped:
              raise SystemExit("Android security tests missing, failing or skipped")
          sdk = pathlib.Path(os.environ["ANDROID_HOME"])
          analyzers = sorted(sdk.glob("cmdline-tools/*/bin/apkanalyzer"))
          if not analyzers:
              raise SystemExit("Installed APK manifest inspector unavailable")
          printed = subprocess.run([str(analyzers[-1]), "manifest", "print", str(apk)], check=True, capture_output=True, text=True).stdout
          manifest = ET.fromstring(printed)
          ns = "{http://schemas.android.com/apk/res/android}"
          package = manifest.get("package")
          application = manifest.find("application")
          sdk_levels = manifest.find("uses-sdk")
          permissions = sorted({p.get(ns + "name") for p in manifest if p.tag.startswith("uses-permission")})
          allowed = {"android.permission.INTERNET", "com.truckcontrolai.app.debug.DYNAMIC_RECEIVER_NOT_EXPORTED_PERMISSION"}
          if package != "com.truckcontrolai.app.debug" or set(permissions) - allowed:
              raise SystemExit("Unexpected Android package or requested permissions")
          if application is None or application.get(ns + "allowBackup") != "false" or application.get(ns + "usesCleartextTraffic") != "false":
              raise SystemExit("Compiled Android network/backup safeguards missing")
          if sdk_levels is None or sdk_levels.get(ns + "minSdkVersion") != "24" or sdk_levels.get(ns + "targetSdkVersion") != "36":
              raise SystemExit("Compiled Android API levels differ from verified policy")
          report = {"commercial_signed": False, "play_published": False, "physical_device_verified": False,
                    "unit_tests": tests, "failures": failures, "skipped": skipped, "permissions": permissions, "compiled_manifest_verified": True,
                    "debug_compiled_manifest_verified": True, "release_aab_manifest_verified": False, "compiled_manifest_scope": ["debug_apk"],
                    "files": [{"name":p.name,"sha256":hashlib.sha256(p.read_bytes()).hexdigest(),"bytes":p.stat().st_size} for p in (apk,aab)]}
          pathlib.Path("app/build/outputs/android-candidate.json").write_text(json.dumps(report,indent=2))
          print(json.dumps(report))
          PY
      - name: Inspect the actual unsigned release AAB manifest and TWA resources
        shell: bash
        run: |
          set -euo pipefail
          export PATH="$JAVA_HOME_21_X64/bin:$PATH"
          python3 scripts/verify_android_release.py \
            --tool "$TRUCKCONTROL_BUNDLETOOL_JAR" \
            --bundle android/app/build/outputs/bundle/release/app-release.aab \
            --candidate-report android/app/build/outputs/android-candidate.json \
            --evidence-dir android/app/build/outputs/release-manifest
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        if: always()
        with:
          name: android-candidate-${{ github.sha }}
          path: |
            android/app/build/outputs/apk/debug/*.apk
            android/app/build/outputs/bundle/release/*.aab
            android/app/build/outputs/android-candidate.json
            android/app/build/outputs/release-manifest/
            android/app/build/reports/
            android/app/build/test-results/
          retention-days: 3
          if-no-files-found: warn
