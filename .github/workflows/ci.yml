name: TruckControl AI checks

on:
  push:
  pull_request:
  workflow_dispatch:

concurrency:
  group: quality-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    # The complete retained + SQL + Android/Windows browser suite now needs
    # about fifteen minutes. Preserve every check with a bounded safety margin.
    timeout-minutes: 25
    env:
      VITE_COMMERCIAL_MODE: "false"
      VITE_SUPABASE_URL: ""
      VITE_SUPABASE_PUBLISHABLE_KEY: ""
      TRUCKCONTROL_RECOVERY_ARTIFACTS: company-recovery-results
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: 24
          cache: npm
      - run: npm ci --ignore-scripts --no-audit --no-fund
      - name: Typecheck personal mail runtime against installed pinned transports
        run: npx --yes deno@2.9.6 check --node-modules-dir=manual --no-config supabase/functions/personal-mail/index.ts
      - run: npm run check
      - name: Check isolated email configuration
        run: python3 -m unittest discover -s tests/python -p 'test_*.py'
      - name: Use the official Ubuntu HTTPS package mirror
        run: |
          sudo python3 - <<'PY'
          from pathlib import Path
          import re

          sources = [Path('/etc/apt/sources.list')]
          sources.extend(Path('/etc/apt').glob('apt-mirrors*.txt'))
          for extension in ('*.list', '*.sources'):
              sources.extend(Path('/etc/apt/sources.list.d').glob(extension))
          changed = 0
          for path in sources:
              if not path.is_file():
                  continue
              original = path.read_text()
              updated = re.sub(
                  r'https?://(?:azure\.)?archive\.ubuntu\.com/ubuntu(?=[/\s]|$)',
                  'https://archive.ubuntu.com/ubuntu',
                  original,
              )
              if updated != original:
                  path.write_text(updated)
                  changed += 1
          for path in sources:
              if path.is_file() and 'azure.archive.ubuntu.com' in path.read_text():
                  raise RuntimeError('An Ubuntu source still uses the stalled Azure mirror')
          print(f'Official Ubuntu archive configured in {changed} source files')
          PY
      - name: Install Chromium and its system dependencies
        timeout-minutes: 5
        run: npx playwright install --with-deps chromium
      - run: npm run test:e2e
      - run: npm run test:e2e:companies
        env:
          TRUCKCONTROL_COMPANY_TEST_ARTIFACTS: company-test-results
      - run: npm run test:e2e:saas
        env:
          TRUCKCONTROL_SAAS_TEST_ARTIFACTS: saas-test-results
      - run: npm run test:e2e:candidate
        env:
          TRUCKCONTROL_CANDIDATE_TEST_ARTIFACTS: candidate-test-results
      - run: npm run test:e2e:production
        env:
          TRUCKCONTROL_PRODUCTION_TEST_ARTIFACTS: production-test-results
      - run: npm run verify:published
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        if: always()
        with:
          name: playwright-report
          path: |
            playwright-report/
            company-test-results/
            saas-test-results/
            candidate-test-results/
            public-test-results/
            production-test-results/
            company-recovery-results/
          retention-days: 7
