name: Isolated PostgreSQL acceptance

on:
  workflow_dispatch:
  push:
    paths:
      - ".github/workflows/isolated-postgres.yml"
      - "scripts/verify-isolated-postgres.py"
      - "scripts/verify-financial-incidents-postgres.py"
      - "scripts/recovery_backup.py"
      - "tests/python/test_recovery_backup.py"
      - "tests/python/test_subscription_postgres_scope.py"
      - "tests/postgres/**"
      - "supabase/migrations/**"
  pull_request:
    paths:
      - ".github/workflows/isolated-postgres.yml"
      - "scripts/verify-isolated-postgres.py"
      - "scripts/verify-financial-incidents-postgres.py"
      - "scripts/recovery_backup.py"
      - "tests/python/test_recovery_backup.py"
      - "tests/python/test_subscription_postgres_scope.py"
      - "tests/postgres/**"
      - "supabase/migrations/**"

permissions:
  contents: read

concurrency:
  group: isolated-postgres-${{ github.ref }}
  cancel-in-progress: true

jobs:
  postgres:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    services:
      postgres:
        # Docker Official Images index, version and immutable digest.
        # https://hub.docker.com/_/postgres
        image: postgres:17.6-bookworm@sha256:f3bd19c606e442c3d7bdfa8002e03fe260a1023351e0ea4598032022b68dd6e3
        env:
          POSTGRES_DB: tc_acceptance
          POSTGRES_PASSWORD: synthetic-disposable-ci-only
        # No published TCP port. Tests use docker exec and the local socket.
        options: >-
          --health-cmd "pg_isready -U postgres -d tc_acceptance"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 12
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false
      - name: Validate harness syntax
        run: python3 -m py_compile scripts/verify-isolated-postgres.py scripts/verify-financial-incidents-postgres.py tests/postgres/subscription_contracts.py tests/postgres/unlinked_contracts.py tests/postgres/snapshot_refresh_contracts.py
      - name: Validate disposable local target isolation without Docker or SQL
        run: python3 -m unittest discover -s tests/python -p 'test_subscription_postgres_scope.py'
      - name: Migrations, two connections, session revocation and logical restore
        env:
          TRUCKCONTROL_POSTGRES_CONTAINER: ${{ job.services.postgres.id }}
        run: python3 scripts/verify-isolated-postgres.py
      - name: Financial incidents, real concurrency and second logical restore
        env:
          TRUCKCONTROL_POSTGRES_CONTAINER: ${{ job.services.postgres.id }}
        run: python3 scripts/verify-financial-incidents-postgres.py
      - name: Preserve synthetic recovery evidence
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: isolated-postgres-report
          path: postgres-recovery-results/
          retention-days: 7
