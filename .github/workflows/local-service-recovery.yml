name: Isolated Auth and Storage recovery

on:
  workflow_dispatch:
  push:
    paths:
      - ".github/workflows/local-service-recovery.yml"
      - "scripts/verify-local-service-recovery.py"
      - "scripts/verify-manual-company-full.py"
      - "scripts/recovery_backup.py"
      - "tests/python/test_local_service_recovery.py"
      - "tests/python/test_manual_company_full_acceptance.py"
      - "tests/python/test_recovery_backup.py"
      - "supabase/migrations/*_company_manual_full_licenses.sql"

permissions:
  contents: read
  packages: read

concurrency:
  group: local-service-recovery-${{ github.ref }}
  cancel-in-progress: false

jobs:
  recover-services:
    if: github.repository == 'smartscaneuskadi/TruckControl-AI' && !github.event.repository.private
    runs-on: ubuntu-24.04
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
        with:
          persist-credentials: false
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38
        with:
          node-version: 24
      - name: Verify pinned CLI and Python syntax
        run: |
          npx --yes supabase@3.1.0 --version
          python3 -m py_compile scripts/verify-local-service-recovery.py
          python3 -m py_compile scripts/verify-manual-company-full.py
          python3 -m unittest discover -s tests/python -p 'test_manual_company_full_acceptance.py' -v
      - name: Authenticate official public GHCR packages with this job's temporary read token
        env:
          GHCR_READ_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: printf '%s' "$GHCR_READ_TOKEN" | docker login ghcr.io --username "$GITHUB_ACTOR" --password-stdin
      - name: Actual Auth, RLS, private file bytes and isolated restore
        env:
          TRUCKCONTROL_LOCAL_SERVICE_ACCEPTANCE: synthetic-only
          SUPABASE_TELEMETRY_DISABLED: "1"
          # Supported by CLI3.1's official docker-registry resolver. Same
          # Supabase service tags, no third-party mirror or TLS changes.
          SUPABASE_INTERNAL_IMAGE_REGISTRY: ghcr.io
        run: python3 scripts/verify-local-service-recovery.py
      - name: Actual manual company Full, native sessions, company RLS and private files
        env:
          TRUCKCONTROL_LOCAL_SERVICE_ACCEPTANCE: synthetic-only
          TRUCKCONTROL_MANUAL_COMPANY_FULL_ACCEPTANCE: synthetic-only
          SUPABASE_TELEMETRY_DISABLED: "1"
          SUPABASE_INTERNAL_IMAGE_REGISTRY: ghcr.io
        run: python3 scripts/verify-manual-company-full.py
      - name: Preserve only sanitized service recovery receipt
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: isolated-service-recovery-${{ github.sha }}
          path: local-service-recovery-results/receipt.json
          if-no-files-found: warn
          retention-days: 7
      - name: Preserve only sanitized manual company Full receipt
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: isolated-manual-company-full-${{ github.sha }}
          path: manual-company-full-results/receipt.json
          if-no-files-found: warn
          retention-days: 7
      - name: Remove the ephemeral registry login
        if: always()
        run: docker logout ghcr.io
